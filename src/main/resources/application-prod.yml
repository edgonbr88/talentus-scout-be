spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:talentus_scout_prod}?sslmode=require&prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PWD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-test-query: SELECT 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000 # 24 horas

talentus:
  storage:
    provider: ${STORAGE_PROVIDER:r2}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      public-bucket: ${R2_PUBLIC_BUCKET:talentus-public}
      private-bucket: ${R2_PRIVATE_BUCKET:talentus-private-documents}
      cdn-base-url: ${R2_CDN_BASE_URL:https://cdn.talentusscout.com}
  # Integracion oficial de streaming con Cloudflare Stream
  video:
    enabled: ${VIDEO_FEATURE_ENABLED:true}
    provider: ${VIDEO_STREAM_PROVIDER:cloudflare}
    max-size-bytes: ${VIDEO_MAX_SIZE_BYTES:524288000}
    cloudflare:
      account-id: ${CLOUDFLARE_STREAM_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_STREAM_API_TOKEN:}
      webhook-secret: ${CLOUDFLARE_STREAM_WEBHOOK_SECRET:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://talentusscout.com}
    certify-url: ${FRONTEND_CERTIFY_URL:https://talentusscout.com/certify}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:contacto@talentusscout.com}
    api-key: ${RESEND_API_KEY:}
    branding:
      logo-url: ${TALENTUS_MAIL_LOGO_URL:https://talentusscout.com/assets/branding/ts-imagotipo-dark-email.png}
  payments:
    vexpay:
      api-url: ${VEXPAY_API_URL:https://api.vexpay.app}
      api-key: ${VEXPAY_API_KEY:}
      webhook-secret: ${VEXPAY_WEBHOOK_SECRET:}
      webhook-tolerance-seconds: ${VEXPAY_WEBHOOK_TOLERANCE_SECONDS:300}
      success-url: ${VEXPAY_SUCCESS_URL:https://talentusscout.com/dashboard?payment=vexpay_return}
      cancel-url: ${VEXPAY_CANCEL_URL:https://talentusscout.com/dashboard?payment=vexpay_cancelled}
      reconcile-enabled: ${VEXPAY_RECONCILE_ENABLED:true}
      reconcile-interval-ms: ${VEXPAY_RECONCILE_INTERVAL_MS:300000}
      reconcile-lookback-hours: ${VEXPAY_RECONCILE_LOOKBACK_HOURS:48}
      livemode: ${VEXPAY_LIVEMODE:true}
  oauth:
    mock-enabled: ${OAUTH_MOCK_ENABLED:false}
    verify-signature: ${OAUTH_VERIFY_SIGNATURE:true}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    microsoft:
      client-id: ${MICROSOFT_OAUTH_CLIENT_ID:}
      jwks-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
