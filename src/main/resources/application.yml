server:
  port: 8080

spring:
  application:
    name: talentus-scout-be
  datasource:
    url: jdbc:postgresql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}?sslmode=disable
    username: ${DB_USER:}
    password: ${DB_PWD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    expiration-time: 86400000 # 24h

talentus:
  video:
    provider: ${VIDEO_STREAM_PROVIDER:}
    upload-dir: ${VIDEO_UPLOAD_DIR:}
    max-size-bytes: 524288000 # 500MB
    mock:
      base-url: ${APP_BASE_URL:}
    cloudflare:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      webhook-secret: ${CLOUDFLARE_WEBHOOK_SECRET:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:}
    certify-url: ${FRONTEND_CERTIFY_URL:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    server: ${MAIL_SERVER:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

